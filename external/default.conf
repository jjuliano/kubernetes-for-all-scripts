# nginx front door on the host (Chapter 12 / 17).
#  is replaced by reload_nginx_configs with the Kind node IP.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://:32080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /guardian/ {
        proxy_pass http://:32001/;
        proxy_set_header Host $host;
    }
}
