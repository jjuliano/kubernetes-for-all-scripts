# Chapter 11 — Kind cluster topology.
# start_env rewrites relative hostPath values to absolute paths so Kind
# (which requires absolute hostPath) can mount this checkout.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 32001
    hostPort: 32001
    protocol: TCP
  - containerPort: 32080
    hostPort: 32080
    protocol: TCP
  extraMounts:
  - hostPath: ./services
    containerPath: /services
  - hostPath: ./scripts
    containerPath: /scripts
- role: worker
- role: worker
