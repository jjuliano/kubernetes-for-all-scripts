apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  labels:
    app: webapp
    app.kubernetes.io/part-of: myapp
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  name: http
